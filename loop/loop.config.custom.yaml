# Configuration for custom STORM Option B run
mode: storm_option_b
max_iterations: 15
state_file: "STATE.yaml"
batch_size: 100
topic_concurrency: 1

roles:
  planner_verifier: "google/gemini-2.5-flash"
  executor_swarm: "google/gemini-2.5-flash"

nav_toor:
  min_word_count: 500
  min_outline_depth: 2
  contradiction_map_min_clashes: 3
  synthesis_min_findings: 5
  peer_review_min_confidence: 7
  fidelity:
    article_mode: "briefing_first"
    article_min_perspective_mentions: 5
    citation_upstream_min_ratio: 0.5
    synthesis_term_overlap_min: 0.3
    contradiction_min_reflected: 2
    blocked_citation_domains:
      - "dictionary.cambridge.org"
      - "merriam-webster.com"
      - "login.adaptiveinsights.com"
    peer_review_min_grade: "B-"
    peer_review_fail_on_missing_perspectives: true
    article_max_attempts_before_escalate: 10
    force_storm_regen_on_drift: true

# Custom topic requested by user
topics:
  - "loop engineering in AI in 2026"
